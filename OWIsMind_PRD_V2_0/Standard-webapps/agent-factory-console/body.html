<!-- OWIsMind - Agent Factory Console: BODY content only (no html/head).
     Paste into the DSS Standard webapp HTML pane. script.js clones the
     <template id="afc-shell"> below into #afc once, then renders each screen
     (Overview / Add or remove run / Settings) into #afcMain.
     English-only UI (internal admin tool). Orange charter styling lives in style.css. -->
<div id="afc" data-theme="light">
  <p class="afc-boot">Loading the console...</p>
</div>
<noscript>
  <p style="padding:24px;">This console needs JavaScript.</p>
</noscript>

<!-- ===== Shell: header + nav, main container, toast, modal (built once) ===== -->
<template id="afc-shell">
  <header class="afc-header">
    <div class="afc-head-left">
      <button class="afc-back" id="afcBack" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>Overview
      </button>
      <div class="afc-brand">
        <p class="afc-eyebrow" id="afcEyebrow">OWIsMind agent factory</p>
        <h1 class="afc-h1" id="afcTitle">Orchestrator and sub-agents</h1>
        <div class="afc-titlebar"></div>
        <p class="afc-head-sub" id="afcSub"></p>
      </div>
    </div>
    <div class="afc-controls">
      <span id="afcHeaderAction"></span>
      <nav class="afc-nav" id="afcNav">
        <button class="afc-nav-item on" data-view="overview">Overview</button>
        <button class="afc-nav-item" data-view="settings">Settings</button>
      </nav>
      <button class="afc-theme" id="afcTheme" title="Light / dark" aria-label="Toggle light / dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10z"/></svg>
      </button>
    </div>
  </header>

  <main class="afc-main" id="afcMain"></main>

  <div class="afc-toast" id="afcToast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>
    <span id="afcToastMsg"></span>
  </div>

  <div class="afc-modal-scrim" id="afcModalScrim" aria-hidden="true">
    <div class="afc-modal" role="dialog" aria-modal="true" aria-labelledby="afcModalTitle">
      <div class="afc-modal-head"><h2 class="afc-modal-title" id="afcModalTitle"></h2></div>
      <div class="afc-modal-body" id="afcModalBody"></div>
      <div class="afc-modal-foot" id="afcModalFoot"></div>
    </div>
  </div>
</template>
